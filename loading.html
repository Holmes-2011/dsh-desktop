<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>DeepSeek Harness</title>
<style>
  body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
         font-family: -apple-system, "PingFang SC", "Helvetica Neue", sans-serif;
         background: linear-gradient(160deg, #0a1828 0%, #0e2a4d 100%); color: #e8f1fb; }
  .box { text-align: center; }
  .spinner { width: 44px; height: 44px; margin: 0 auto 20px; border: 4px solid rgba(255,255,255,.15);
            border-top-color: #4da3ff; border-radius: 50%; animation: spin 1s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  p { font-size: 15px; opacity: .85; }
</style>
</head>
<body>
  <div class="box">
    <div class="spinner"></div>
    <p>正在启动 DeepSeek Harness…</p>
  </div>
</body>
</html>
